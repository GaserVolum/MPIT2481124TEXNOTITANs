			    <!-- Кнопка для открытия модального окна -->
<button id="openModal" class="openModalBtn">Создать или присоединиться</button>

<div id="modal2" class="modal2">
    <div class="modal-content2">
        <button class="close">Закрыть</button>
        <button class="send">Создать(присоединиться)</button>
        <input type="text" id="linkInput" class="linkInput" placeholder="ссылка или название" name="2"/>
    </div>
</div>



<script>
    const modal2 = document.querySelector('#modal2'); // Модальное окно
const btn = document.querySelector('#openModal'); // Кнопка для открытия модального окна
const close = document.querySelector('.close'); // Кнопка для закрытия модального окна
const send = document.querySelector('.send'); // Кнопка для действия "Присоединиться"
const linkInput = document.querySelector('#linkInput'); // Поле для ввода ссылки или названия

// Открытие модального окна при клике на кнопку
btn.onclick = function () {
    modal2.style.display = 'block'; // Показываем модальное окно
};

// Закрытие модального окна
close.onclick = function () {
    modal2.style.display = 'none'; // Скрываем модальное окно
};

// Закрытие модального окна при клике вне его
window.onclick = function (event) {
    if (event.target === modal2) {
        modal2.style.display = 'none'; // Скрыть модальное окно, если кликнули вне его
    }
};

// Переход по ссылке или выполнение действия при нажатии на кнопку "Присоединиться"
send.onclick = function () {
    const inputValue = linkInput.value.trim(); // Получаем введённое значение (название или ссылку)

    if (inputValue) {
        // Проверим, является ли введённое значение валидным URL
        const urlPattern = /^(https?|ftp):\/\/[^\s/$.?#].[^\s]*$/i; // Простой регекс для проверки URL
        if (urlPattern.test(inputValue)) {
            // Если это валидная ссылка, переходим по ней
            window.location.href = inputValue; // Переход по ссылке
        } else {
            // Если введено название, просто выводим сообщение
            alert('Вы присоединились к конференции: ' + inputValue);
            modal2.style.display = 'none'; // Закрываем модальное окно
        }
    } else {
        // Если поле пустое, показываем предупреждение
        alert('Пожалуйста, введите ссылку или название конференции.');
    }
};

</script>
