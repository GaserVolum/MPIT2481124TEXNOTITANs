<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход | SM-Вебинары</title>
    <link href="../public/css/main.css" rel="stylesheet" type="text/css">
</head>
<body>

    <div class="circle1"></div>
    <div class="circle2"></div>

    <section class="headerDiv" id="headerDiv">
        <header class="UpPanel">
            <a href="index.html">
                <img src="../public/pic/logo.png" alt="SM-Вебинары">
            </a>
            <nav>
                <a href="#" class="headerButtons">
                    <img src="../public/pic/account.svg">
                </a>
                <a href="#" class="headerButtons">
                    <img src="../public/pic/email.svg">
                </a>
                <a href="#" class="headerButtons">
                    <img src="../public/pic/menu.svg">
                </a>
            </nav>
        </header>
    </section>

    <section class="MenuRegistration">
        <h2>Вход</h2>
        <div class="inputRedFields">
            <input type="text" id="login" placeholder="Логин" required>
            <input type="password" id="password" placeholder="Пароль" required>
        
        </div>
        <button id="submitButton" class="nextButReg">Продолжить</button>
        <div id="errorMessage" style="color: red; display: none;">Ошибка: Пароли не совпадают или логин уже существует.</div>
    </section>

    <script src="registration.js"></script>
</body>
</html>
